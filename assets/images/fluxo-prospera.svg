<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" role="img" aria-labelledby="title desc">
  <title id="title">Como o Prospera organiza a jornada financeira</title>
  <desc id="desc">Fluxo em três etapas: registrar custos, acompanhar o progresso e construir patrimônio.</desc>
  <defs>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#1f6b4b"/>
      <stop offset="1" stop-color="#c99a3c"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#123d2c" flood-opacity=".1"/>
    </filter>
  </defs>
  <rect width="1200" height="300" rx="24" fill="#f7f5ed"/>
  <path d="M250 104H950" stroke="#dde4df" stroke-width="4" stroke-linecap="round"/>
  <path d="M250 104H950" stroke="url(#line)" stroke-width="4" stroke-linecap="round" stroke-dasharray="170 65"/>

  <g filter="url(#shadow)">
    <g transform="translate(210 64)">
      <circle cx="40" cy="40" r="40" fill="#123d2c"/>
      <rect x="25" y="22" width="30" height="36" rx="5" fill="none" stroke="#f0d88b" stroke-width="3"/>
      <path d="M31 32h18M31 40h18M31 48h10" stroke="#f0d88b" stroke-width="3" stroke-linecap="round"/>
    </g>
    <g transform="translate(560 64)">
      <circle cx="40" cy="40" r="40" fill="#1f6b4b"/>
      <path d="M22 54V39M33 54V29M44 54V35M55 54V20" stroke="#fff" stroke-width="6" stroke-linecap="round"/>
      <path d="m21 30 12-8 11 3 13-13" fill="none" stroke="#f0d88b" stroke-width="3" stroke-linecap="round"/>
    </g>
    <g transform="translate(910 64)">
      <circle cx="40" cy="40" r="40" fill="#c99a3c"/>
      <path d="M40 59V36c0-10 7-18 18-18-1 12-7 18-18 18M40 45c-11 0-18-6-19-17 11-1 19 6 19 17Z" fill="#123d2c"/>
    </g>
  </g>

  <g font-family="Arial, sans-serif" text-anchor="middle">
    <text x="250" y="181" fill="#17221d" font-family="Georgia, serif" font-size="21" font-weight="700">Registre</text>
    <text x="250" y="208" fill="#68766f" font-size="13">Informe seus custos fixos</text>
    <text x="250" y="228" fill="#68766f" font-size="13">com poucos passos.</text>

    <text x="600" y="181" fill="#17221d" font-family="Georgia, serif" font-size="21" font-weight="700">Acompanhe</text>
    <text x="600" y="208" fill="#68766f" font-size="13">Visualize saldo, metas</text>
    <text x="600" y="228" fill="#68766f" font-size="13">e evolução financeira.</text>

    <text x="950" y="181" fill="#17221d" font-family="Georgia, serif" font-size="21" font-weight="700">Prospere</text>
    <text x="950" y="208" fill="#68766f" font-size="13">Transforme constância</text>
    <text x="950" y="228" fill="#68766f" font-size="13">em patrimônio.</text>
  </g>
</svg>
